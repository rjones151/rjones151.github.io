<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        line-height: 1.6;
        color: #333;
    }

    .hero {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 3rem;
        text-align: center;
    }

    .hero-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 900px;
    }

    .scroll-indicator {
        padding-bottom: 3rem;
    }

    .scroll-indicator p:first-child {
        font-size: clamp(1rem, 2vw, 1.2rem);
        margin-bottom: 0.5rem;
        color: #666;
    }

    .arrow {
        font-size: clamp(2rem, 4vw, 3rem);
        color: #333;
    }

    @media (max-width: 768px) {
        .hero {
            padding: 1.5rem;
        }

        .scroll-indicator {
            padding-bottom: 2rem;
        }

        .content {
            padding: 3rem 1.5rem;
        }
    }

    @media (max-width: 480px) {
        .hero {
            padding: 1rem;
        }

        h1 {
            margin-bottom: 1rem;
        }

        .scroll-indicator {
            padding-bottom: 1.5rem;
        }

        .content {
            padding: 2rem 1rem;
        }
    }

    html {
        scroll-behavior: smooth;
    }
</style>


<section class="hero">
    <div class="hero-content">
        <h1>Rhiannon Jones</h1>
        <h2>
            <span class="normal">software engineer</span>
        </h2>
    </div>
    
    <div class="scroll-indicator">
        <p>onto the good stuff</p>
        <p class="arrow">&darr;</p>
    </div>
</section>
